<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080A0E">
<meta name="color-scheme" content="dark">
<title>fsx · 文件传送</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%234C8DFF'/%3E%3Cstop offset='1' stop-color='%232EE6A8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M16 7l8 9h-5v9h-6v-9H8z' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M12 5l-6 6M12 5l6 6"/></symbol>
  <symbol id="i-recv" viewBox="0 0 24 24"><path d="M12 5v14M12 19l-6-6M12 19l6-6"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M20 15a3 3 0 0 1-3 3H8l-4 3V6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3z"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M15 5.5A2.5 2.5 0 0 0 12.5 3h-7A2.5 2.5 0 0 0 3 5.5v7A2.5 2.5 0 0 0 5.5 15"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-11"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/><path d="M16 9a4.5 4.5 0 0 1 0 6M18.8 6.5a8 8 0 0 1 0 11"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M12 15l-4.5-4.5M12 15l4.5-4.5M4.5 19.5h15"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-desktop" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12" rx="2.5"/><path d="M9 20h6M12 16.5V20"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18.5h10a4 4 0 0 0 .4-8A6 6 0 0 0 6 11.2 3.7 3.7 0 0 0 7 18.5z"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="9.5" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5A2 2 0 0 1 5.5 5.5h3.7l2 2.5h7.3a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9.5 5.5l6.5 6.5-6.5 6.5"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V5h5v2M6.5 7l1 12.5h9L17.5 7"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M4 9h9.5a5.5 5.5 0 1 1 0 11H8"/><path d="M4 9l4-4M4 9l4 4"/></symbol>
  <symbol id="i-keys" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M8 14h8"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></symbol>
  <symbol id="i-sort" viewBox="0 0 24 24"><path d="M7 4.5v15M7 19.5L3.5 16M7 19.5L10.5 16M17 19.5v-15M17 4.5L13.5 8M17 4.5L20.5 8"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13.5 3L5.5 13.5h5L10 21l8.5-10.5h-5z"/></symbol>
</svg>

<div class="ambient" aria-hidden="true">
  <div class="aurora a1"></div>
  <div class="aurora a2"></div>
  <div class="mesh"></div>
  <div class="grain"></div>
</div>

<div class="app">
  <aside class="rail">
    <div class="brand">
      <span class="mark"><svg viewBox="0 0 32 32"><path d="M16 7l8 9h-5v9h-6v-9H8z"/></svg></span>
      <span class="wordmark">fsx</span>
      <span class="ver" id="ver">—</span>
    </div>

    <section class="me" id="me">
      <span class="avatar lg" id="meAvatar">··</span>
      <div class="me-body">
        <div class="me-name" id="meName">正在连接本机节点…</div>
        <button class="idchip" id="meID" title="复制完整节点 ID">
          <span class="mono" id="meIDText">—</span>
          <svg class="ic"><use href="#i-copy"/></svg>
        </button>
      </div>
    </section>

    <section class="pair" id="pairCard" hidden>
      <div class="pair-top">
        <span class="micro">手机 / 其他设备配对码</span>
        <button class="iconbtn sm" id="copyCode" title="复制配对码" aria-label="复制配对码"><svg class="ic"><use href="#i-copy"/></svg></button>
      </div>
      <div class="code" id="pairCode">······</div>
      <div class="pair-hint">在对方浏览器打开 <span class="mono" id="lanURL">本机地址</span> 后输入</div>
    </section>

    <div class="rail-head">
      <span class="micro">设备</span>
      <span class="tally" id="peerCount">0</span>
      <span class="spacer"></span>
      <button class="iconbtn sm" id="peerSearchToggle" title="搜索设备" aria-label="搜索设备"><svg class="ic"><use href="#i-search"/></svg></button>
    </div>
    <div class="field slim" id="peerSearchWrap" hidden>
      <svg class="ic"><use href="#i-search"/></svg>
      <input id="peerSearch" placeholder="按名称或 ID 过滤" autocomplete="off" aria-label="搜索设备">
    </div>

    <div class="devices scroll" id="devices"></div>

    <form class="addpeer" id="addForm" autocomplete="off">
      <div class="field">
        <svg class="ic"><use href="#i-plus"/></svg>
        <input id="manualAddr" placeholder="节点 ID 或 IP:端口" aria-label="添加设备">
      </div>
      <button class="btn solid sm" id="addPeer" type="submit">添加</button>
    </form>

    <div class="rail-foot">
      <span class="linkstate" id="relayPill"><i class="beacon"></i><span id="relayText">中继 未配置</span></span>
    </div>
  </aside>

  <main class="stage">
    <header class="stage-head">
      <nav class="tabs" role="tablist">
        <button class="tab active" data-tab="transfers" role="tab"><svg class="ic"><use href="#i-bolt"/></svg><span>传输</span><span class="tally" id="tabLive">0</span></button>
        <button class="tab" data-tab="inbox" role="tab"><svg class="ic"><use href="#i-folder"/></svg><span>收件箱</span><span class="tally" id="tabInbox">0</span></button>
        <button class="tab" data-tab="messages" role="tab"><svg class="ic"><use href="#i-chat"/></svg><span>消息</span><span class="tally" id="tabMsgs">0</span></button>
      </nav>
      <div class="head-tools">
        <div class="field slim search" id="searchWrap">
          <svg class="ic"><use href="#i-search"/></svg>
          <input id="search" placeholder="搜索文件、设备…  /" autocomplete="off" aria-label="搜索">
          <button class="iconbtn xs" id="searchClear" hidden aria-label="清除搜索"><svg class="ic"><use href="#i-x"/></svg></button>
        </div>
        <label class="selectwrap" title="排序">
          <svg class="ic"><use href="#i-sort"/></svg>
          <select id="sort" aria-label="排序">
            <option value="recent">最近优先</option>
            <option value="size">按大小</option>
            <option value="name">按名称</option>
          </select>
        </label>
        <button class="iconbtn" id="soundBtn" title="提示音" aria-label="提示音开关"><svg class="ic"><use href="#i-sound"/></svg></button>
        <button class="iconbtn" id="keysBtn" title="快捷键" aria-label="快捷键"><svg class="ic"><use href="#i-keys"/></svg></button>
      </div>
    </header>

    <div class="metrics" id="metrics">
      <div class="metric"><span class="micro">进行中</span><b class="num" id="mActive">0</b><span class="unit">个任务</span></div>
      <div class="metric"><span class="micro">本次发送</span><b class="num" id="mSent">0 B</b><span class="unit" id="mSentN">0 个任务</span></div>
      <div class="metric"><span class="micro">本次接收</span><b class="num" id="mRecv">0 B</b><span class="unit" id="mRecvN">0 个任务</span></div>
      <div class="metric wide"><span class="micro">实时速率</span><b class="num accent" id="mSpeed">0 B/s</b><canvas class="spark" id="spark" height="34"></canvas></div>
    </div>

    <section class="view" id="view-transfers">
      <div class="dropzone" id="dropzone">
        <div class="rings" aria-hidden="true"><i></i><i></i><i></i><span class="core"><svg class="ic"><use href="#i-send"/></svg></span></div>
        <div class="dz-body">
          <h1 class="dz-title">把文件拖到这里</h1>
          <p class="dz-sub" id="dzSub">松手即发送 · 全程 TLS 1.3 加密 · 断点续传</p>
          <div class="dz-actions">
            <button class="btn solid" id="pickBtn"><svg class="ic"><use href="#i-plus"/></svg>选择文件</button>
            <span class="dz-target" id="dzTarget">未选择设备</span>
          </div>
        </div>
        <div class="dz-filters" id="jobFilters">
          <button class="chip active" data-filter="all">全部</button>
          <button class="chip" data-filter="live">进行中</button>
          <button class="chip" data-filter="pending">待确认</button>
          <button class="chip" data-filter="done">已完成</button>
          <span class="spacer"></span>
          <button class="btn ghost sm" id="clearDone"><svg class="ic"><use href="#i-trash"/></svg>清除已完成</button>
        </div>
      </div>

      <div class="upload" id="uploadStrip" hidden>
        <span class="up-ic"><svg class="ic"><use href="#i-send"/></svg></span>
        <div class="up-body">
          <div class="up-top"><span id="upName">—</span><span class="mono" id="upPct">0%</span></div>
          <div class="track"><i id="upFill"></i></div>
          <div class="up-sub" id="upSub">正在把文件交给本机节点…</div>
        </div>
        <button class="iconbtn" id="upCancel" title="取消上传" aria-label="取消上传"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>

      <div class="list scroll" id="jobs"></div>
    </section>

    <section class="view" id="view-inbox" hidden>
      <div class="viewhead">
        <h2>收到的文件</h2>
        <span class="hint">保存在 <button class="pathbtn mono" id="dlDir" title="复制接收目录">—</button></span>
      </div>
      <div class="list scroll" id="inbox"></div>
    </section>

    <section class="view msgsview" id="view-messages" hidden>
      <div class="convs scroll" id="convs"></div>
      <div class="thread">
        <div class="thread-head">
          <button class="iconbtn sm only-mobile" id="convBack" aria-label="返回会话列表"><svg class="ic"><use href="#i-back"/></svg></button>
          <span class="avatar sm" id="convAvatar">··</span>
          <div class="th-body"><div class="th-name" id="convName">选择一个设备</div><div class="th-sub mono" id="convSub">端到端加密的文字消息</div></div>
          <button class="btn ghost sm" id="convSend" hidden><svg class="ic"><use href="#i-send"/></svg>发文件</button>
        </div>
        <div class="bubbles scroll" id="bubbles"></div>
        <form class="composer" id="composer">
          <textarea id="msgInput" rows="1" placeholder="输入消息，Enter 发送 / Shift+Enter 换行" aria-label="消息内容"></textarea>
          <button class="btn solid" id="msgSend" type="submit" aria-label="发送消息"><svg class="ic"><use href="#i-send"/></svg></button>
        </form>
      </div>
    </section>

    <footer class="statusbar">
      <span class="sb-item"><svg class="ic"><use href="#i-lock"/></svg>TLS 1.3 · 证书指纹绑定</span>
      <span class="sb-item" id="sbPorts">—</span>
      <span class="spacer"></span>
      <span class="sb-item" id="sbPeak">峰值 —</span>
      <span class="sb-item" id="sbState"><i class="beacon on"></i>已连接本机节点</span>
    </footer>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="详情">
  <div class="drawer-head">
    <span class="micro" id="drawerKind">详情</span>
    <span class="spacer"></span>
    <button class="iconbtn" id="drawerClose" aria-label="关闭详情"><svg class="ic"><use href="#i-x"/></svg></button>
  </div>
  <div class="drawer-body scroll" id="drawerBody"></div>
</aside>

<div class="modal" id="modal" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<div class="veil" id="veil" hidden>
  <div class="veil-card">
    <div class="rings big" aria-hidden="true"><i></i><i></i><i></i><span class="core"><svg class="ic"><use href="#i-recv"/></svg></span></div>
    <div class="veil-title" id="veilTitle">松手后选择接收设备</div>
    <div class="veil-sub" id="veilSub">文件会先交给本机节点，再直连发送</div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<input type="file" id="fileInput" multiple hidden>

<script src="/app.js"></script>
</body>
</html>
